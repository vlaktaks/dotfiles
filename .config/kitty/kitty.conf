# Remove the include below to disconnect Kitty from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Font
# font_family JetBrainsMono Nerd Font
font_size 14

# Window padding
# window_padding_width 14

# Rundfunk-inspired motion effects
# Native cursor trail (text cursor) - restrained and visible without custom shader compilation.
cursor_trail 10
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2
cursor_trail_color #D6B45A

# Terminal bell behavior
# Keep bells silent and non-flashing: Bash completion no longer emits BEL because
# Kitty's native visual bell is a full-window flash and cannot be made sufficiently subtle.
enable_audio_bell no
visual_bell_duration 0.0
visual_bell_color none
window_alert_on_bell no

# Custom shader pipelines (require shader-slang/slangc to compile .slang shaders).
# Kept in .config/kitty/shaders for environments where slangc is available:
# - cursor-trail-motion-blur (shipped Kitty shader name) for smoother cursor trails
# - bell-pulse: subtle gold feedback on bell-in-window
# - focus-glow: brief cyan accent on os-window-focus-in/tab-change
# Uncomment to enable when slangc is installed:
# custom_shaders cursor-trail-motion-blur bell-pulse focus-glow

# Unmap a shortcut, passing it through to the terminal application
# map ctrl+insert

# Set or replace a shortcut
# map ctrl+shift+c copy_to_clipboard

# Remove all inherited shortcuts, including Kitty's built-in shortcuts
# clear_all_shortcuts yes
